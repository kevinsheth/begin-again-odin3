iWaterReflectHeight=256
iWaterBlurAmount=0

[TerrainManager]
fBlockLoadDistanceLow=25000
fBlockLoadDistance=125000
fTreeLoadDistance=0
fSplitDistanceMult=0.75

[SpeedTree]
bForceFullLOD=0

[LOD]
