iSize W=1600
iSize H=900
iMultiSample=0
iWaterMultisamples=0
iMaxAnisotropy=1
iMaxDecalsPerFrame=2
fSpecularLODStartFade=200
fShadowLODStartFade=100
fLightLODStartFade=200
